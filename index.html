<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Study Planner</h1>
    <p class="intro">Add an assignment and see how many days remain until it is due.</p>

    <form id="assignment-form">
      <label for="assignment-name">Assignment name</label>
      <input id="assignment-name" name="assignment-name" type="text" placeholder="Example: History essay">

      <label for="due-date">Due date</label>
      <input id="due-date" name="due-date" type="date">

      <button type="submit">Add assignment</button>
    </form>

    <p id="message" class="message" role="alert" aria-live="polite"></p>

    <section aria-labelledby="assignment-heading">
      <div class="section-heading">
        <h2 id="assignment-heading">Assignments</h2>
        <button id="clear-button" class="secondary-button" type="button">Clear all</button>
      </div>
      <p id="empty-message">No assignments yet.</p>
      <ul id="assignment-list"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
